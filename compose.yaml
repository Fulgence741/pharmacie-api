services:
  pharmacie-api:
    build: .
    container_name: pharmacie-api
    env_file:
      - .env
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
